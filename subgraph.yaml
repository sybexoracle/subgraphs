specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SybexOracle
    network: sepolia
    source:
      address: "0xBd4B00ed877c9424a4675B93Dbd8819824F33593"
      abi: SybexOracle
      startBlock: 9853382
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AnswerProvided
        - FeeRecipientUpdated
        - FeeUpdated
        - QuestionAsked
        - ResolverAdded
        - ResolverRemoved
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
      abis:
        - name: SybexOracle
          file: ./abis/SybexOracle.json
      eventHandlers:
        - event: AnswerProvided(indexed uint256,indexed address,bytes)
          handler: handleAnswerProvided
        - event: FeeRecipientUpdated(address)
          handler: handleFeeRecipientUpdated
        - event: FeeUpdated(uint256)
          handler: handleFeeUpdated
        - event: QuestionAsked(indexed uint256,uint8,string,uint256,indexed address)
          handler: handleQuestionAsked
        - event: ResolverAdded(indexed address)
          handler: handleResolverAdded
        - event: ResolverRemoved(indexed address)
          handler: handleResolverRemoved
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
      file: ./src/sybex-oracle.ts
  - kind: ethereum
    name: SybexAutomatedMarket
    network: sepolia
    source:
      address: "0x68078aAddd65efE7e43c70D306ce7B5b33212CF6"
      abi: SybexAutomatedMarket
      startBlock: 9853412
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - FeesWithdrawn
        - Initialized
        - MarketCancelled
        - MarketCreated
        - MarketResolved
        - OrderPlaced
        - RefundIssued
        - SybexAutomatedMarketRoleAdminChanged
        - SybexAutomatedMarketRoleGranted
        - SybexAutomatedMarketRoleRevoked
        - WinningsClaimed
      abis:
        - name: SybexAutomatedMarket
          file: ./abis/SybexAutomatedMarket.json
      eventHandlers:
        - event: FeesWithdrawn(indexed address,uint256)
          handler: handleFeesWithdrawn
        - event: Initialized(uint64)
          handler: handleInitialized
        - event: MarketCancelled(indexed uint256,indexed address)
          handler: handleMarketCancelled
        - event: MarketCreated(indexed uint256,string,uint8,indexed address,uint256)
          handler: handleMarketCreated
        - event: MarketResolved(indexed uint256,uint256,address)
          handler: handleMarketResolved
        - event: OrderPlaced(indexed uint256,indexed address,indexed uint256,uint256)
          handler: handleOrderPlaced
        - event: RefundIssued(indexed uint256,indexed address,uint256)
          handler: handleRefundIssued
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: WinningsClaimed(indexed uint256,indexed address,uint256)
          handler: handleWinningsClaimed
      file: ./src/sybex-automated-market.ts
