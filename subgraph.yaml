specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SybexOracle
    network: bsc
    source:
      address: "0xa2E97a955dbFE75c4BEa91c80a6F821654f77b7B"
      abi: SybexOracle
      startBlock: 71224956
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - AnswerProvided
        - FeeRecipientUpdated
        - FeeUpdated
        - QuestionAsked
        - ResolverAdded
        - ResolverRemoved
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
      abis:
        - name: SybexOracle
          file: ./abis/SybexOracle.json
      eventHandlers:
        - event: AnswerProvided(indexed uint256,indexed address,bytes)
          handler: handleAnswerProvided
        - event: FeeRecipientUpdated(address)
          handler: handleFeeRecipientUpdated
        - event: FeeUpdated(uint256)
          handler: handleFeeUpdated
        - event: QuestionAsked(indexed uint256,uint8,string,uint256,indexed address)
          handler: handleQuestionAsked
        - event: ResolverAdded(indexed address)
          handler: handleResolverAdded
        - event: ResolverRemoved(indexed address)
          handler: handleResolverRemoved
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
      file: ./src/sybex-oracle.ts
