type AnswerProvided @entity(immutable: true) {
  id: Bytes!
  questionId: BigInt! # uint256
  resolver: Bytes! # address
  answerData: Bytes! # bytes
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

