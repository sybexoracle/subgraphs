}

type QuestionAsked @entity(immutable: true) {
  id: Bytes!
  questionId: BigInt! # uint256
  questionType: Int! # uint8
  questionText: String! # string
  timeout: BigInt! # uint256
  asker: Bytes! # address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

